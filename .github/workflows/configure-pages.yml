name: Configure GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            gh api "repos/${{ github.repository }}/pages" \
              --method PUT \
              --field "source[branch]=master" \
              --field "source[path]=/"
          else
            gh api "repos/${{ github.repository }}/pages" \
              --method POST \
              --field "source[branch]=master" \
              --field "source[path]=/"
          fi